<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Logística</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e1e; color: white; padding: 20px; }
        .contenedor { max-width: 600px; margin: auto; background: #2d2d2d; padding: 20px; border-radius: 8px; }
        .alerta { background-color: #ff3333; padding: 10px; margin: 10px 0; border-left: 5px solid white; border-radius: 4px;}
        button { background: #007acc; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; }
        button:hover { background: #005999; }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>🚚 Control de Embarques de la Bodega</h2>
        <p>Presiona el botón para procesar los datos enviados por el Backend (C#):</p>
        <button id="btnProcesar">Procesar Datos</button>
        
        <div id="pantallaResultados">
            </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
